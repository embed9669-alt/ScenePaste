name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev + Qt extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui-qt]"

      - name: Run tests with coverage
        run: pytest --cov=scenepaste --cov=compose_app --cov=compose_app_qt --cov-report=xml -q

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check scenepaste compose_app compose_app_qt tests scripts
      # Engine + formats; loose modules overridden in pyproject.toml [tool.mypy].
      - run: mypy scenepaste/core scenepaste/formats --ignore-missing-imports --no-strict-optional

  wheel-smoke:
    name: Installed wheel smoke
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel + Qt outside editable tree
        run: |
          python -m pip install dist/scenepaste-*.whl "PySide6>=6.5"
      - name: Run installed smoke
        run: |
          # Copy the smoke script out of the checkout so imports resolve from site-packages.
          mkdir -p /tmp/scenepaste-smoke
          cp scripts/smoke_installed.py /tmp/scenepaste-smoke/
          cd /tmp/scenepaste-smoke
          python smoke_installed.py --require-qt
